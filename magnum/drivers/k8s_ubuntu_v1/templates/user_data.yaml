packages:
  - containerd

runcmd:
  - mkdir -p /var/lib/cloud/data
  - chmod 0755 /var/lib/cloud/data
  - mkdir -p /var/lib/heat-cfntools
  - chmod 0755 /var/lib/heat-cfntools
  - sysctl -p /etc/sysctl.d/max-user-watches.conf
  - sysctl -p /etc/sysctl.d/k8s_custom.conf
  - bash /root/configure-agent-env.sh
  - systemctl enable --now containerd
  - ctr images pull __CONTAINER_INFRA_PREFIX__heat-container-agent:__HEAT_CONTAINER_AGENT_TAG__
  - |
    ctr run \
      --net-host \
      --mount type=bind,src=/srv/magnum,dst=/srv/magnum,options=rbind:rw \
      --mount type=bind,src=/opt/stack/os-config-refresh,dst=/opt/stack/os-config-refresh,options=rbind:rw \
      --mount type=bind,src=/run/systemd,dst=/run/systemd,options=rbind:rw \
      --mount type=bind,src=/etc,dst=/etc,options=rbind:rw \
      --mount type=bind,src=/var/lib,dst=/var/lib,options=rbind:rw \
      --mount type=bind,src=/var/run,dst=/var/run,options=rbind:rw \
      --mount type=bind,src=/var/log,dst=/var/log,options=rbind:rw \
      --mount type=bind,src=/tmp,dst=/tmp,options=rbind:rw \
      --mount type=bind,src=/dev,dst=/dev,options=rbind:rw \
      --env REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
      __CONTAINER_INFRA_PREFIX__heat-container-agent:__HEAT_CONTAINER_AGENT_TAG__ \
      heat-container-agent \
      /usr/bin/start-heat-container-agent
  - echo "========== Cloud-init output log =========="
  - cat /var/log/cloud-init-output.log
  - echo "========== Cloud-init log =========="
  - cat /var/log/cloud-init.log